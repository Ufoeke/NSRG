version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nsrg-postgres
    environment:
      POSTGRES_DB: nsrg_db
      POSTGRES_USER: nsrg_user
      POSTGRES_PASSWORD: nsrg_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - ./scripts/wireless-security-schema.sql:/docker-entrypoint-initdb.d/wireless-security-schema.sql
      - ./scripts/vlan-schema.sql:/docker-entrypoint-initdb.d/vlan-schema.sql
      - ./scripts/firewall-schema.sql:/docker-entrypoint-initdb.d/firewall-schema.sql
      - ./scripts/customer-schema-enhancement.sql:/docker-entrypoint-initdb.d/customer-schema-enhancement.sql
      - ./scripts/enhance-schema.sql:/docker-entrypoint-initdb.d/enhance-schema.sql
    ports:
      - "5432:5432"
    networks:
      - nsrg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsrg_user -d nsrg_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nsrg-redis
    command: redis-server --appendonly yes --requirepass redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - nsrg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nsrg-app
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nsrg_db
      DB_USER: nsrg_user
      DB_PASSWORD: nsrg_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_password
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      API_BASE_URL: http://localhost:5000
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - nsrg-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Development Frontend (optional - for development only)
  frontend-dev:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.dev
    container_name: nsrg-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    networks:
      - nsrg-network
    environment:
      VITE_API_BASE_URL: http://localhost:5000
    profiles:
      - development
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  nsrg-network:
    driver: bridge