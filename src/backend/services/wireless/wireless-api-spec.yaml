openapi: 3.0.3
info:
  title: Wireless Service API
  description: |
    Multi-vendor wireless network management API supporting SSID management, 
    access point deployment, and security policy configuration for Cisco Meraki MR, 
    FortiAP, Cisco Catalyst WiFi, and Aruba access points.
  version: 1.0.0
  contact:
    name: Network Service Platform
    email: support@networkplatform.com

servers:
  - url: http://localhost:3000/api/v1
    description: Development server
  - url: https://api.networkplatform.com/v1
    description: Production server

security:
  - bearerAuth: []
  - apiKey: []

paths:
  # SSID Management Endpoints
  /wireless/ssids:
    get:
      summary: List all SSIDs
      description: Retrieve all configured SSIDs across all access points
      tags:
        - SSID Management
      parameters:
        - name: networkId
          in: query
          description: Filter by network ID
          schema:
            type: string
        - name: vendor
          in: query
          description: Filter by vendor
          schema:
            type: string
            enum: [cisco-meraki, fortiap, cisco-catalyst, aruba]
        - name: enabled
          in: query
          description: Filter by enabled status
          schema:
            type: boolean
        - name: limit
          in: query
          description: Number of results to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of SSIDs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SSID'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      summary: Create new SSID
      description: Create a new SSID configuration across specified access points
      tags:
        - SSID Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSSIDRequest'
      responses:
        '201':
          description: SSID created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: SSID name conflict
        '500':
          $ref: '#/components/responses/InternalError'

  /wireless/ssids/{ssidId}:
    get:
      summary: Get SSID details
      description: Retrieve detailed information about a specific SSID
      tags:
        - SSID Management
      parameters:
        - name: ssidId
          in: path
          required: true
          description: SSID identifier
          schema:
            type: string
      responses:
        '200':
          description: SSID details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSID'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      summary: Update SSID
      description: Update an existing SSID configuration
      tags:
        - SSID Management
      parameters:
        - name: ssidId
          in: path
          required: true
          description: SSID identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSSIDRequest'
      responses:
        '200':
          description: SSID updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Delete SSID
      description: Remove an SSID configuration from all access points
      tags:
        - SSID Management
      parameters:
        - name: ssidId
          in: path
          required: true
          description: SSID identifier
          schema:
            type: string
      responses:
        '204':
          description: SSID deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /wireless/ssids/bulk:
    post:
      summary: Bulk SSID operations
      description: Create, update, or delete multiple SSIDs in a single operation
      tags:
        - SSID Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkSSIDRequest'
      responses:
        '202':
          description: Bulk operation initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  # Access Point Management
  /wireless/access-points:
    get:
      summary: List access points
      description: Retrieve all managed access points
      tags:
        - Access Point Management
      parameters:
        - name: vendor
          in: query
          description: Filter by vendor
          schema:
            type: string
            enum: [cisco-meraki, fortiap, cisco-catalyst, aruba]
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [online, offline, maintenance]
        - name: location
          in: query
          description: Filter by location
          schema:
            type: string
      responses:
        '200':
          description: List of access points
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccessPoint'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      summary: Register access point
      description: Register a new access point for management
      tags:
        - Access Point Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessPointRequest'
      responses:
        '201':
          description: Access point registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPoint'

  /wireless/access-points/{apId}:
    get:
      summary: Get access point details
      tags:
        - Access Point Management
      parameters:
        - name: apId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Access point details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPoint'

    put:
      summary: Update access point
      tags:
        - Access Point Management
      parameters:
        - name: apId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccessPointRequest'
      responses:
        '200':
          description: Access point updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPoint'

  # Security Profile Management
  /wireless/security-profiles:
    get:
      summary: List security profiles
      description: Retrieve all configured security profiles
      tags:
        - Security Profiles
      responses:
        '200':
          description: List of security profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecurityProfile'

    post:
      summary: Create security profile
      description: Create a new security profile template
      tags:
        - Security Profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecurityProfileRequest'
      responses:
        '201':
          description: Security profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityProfile'

  /wireless/security-profiles/{profileId}:
    get:
      summary: Get security profile
      tags:
        - Security Profiles
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Security profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityProfile'

    put:
      summary: Update security profile
      tags:
        - Security Profiles
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecurityProfileRequest'
      responses:
        '200':
          description: Security profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityProfile'

  # VLAN Integration
  /wireless/vlan-mappings:
    get:
      summary: List VLAN mappings
      description: Retrieve SSID to VLAN mappings
      tags:
        - VLAN Integration
      parameters:
        - name: ssidId
          in: query
          description: Filter by SSID
          schema:
            type: string
        - name: vlanId
          in: query
          description: Filter by VLAN ID
          schema:
            type: integer
      responses:
        '200':
          description: VLAN mappings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VLANMapping'

    post:
      summary: Create VLAN mapping
      description: Map an SSID to specific VLANs
      tags:
        - VLAN Integration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVLANMappingRequest'
      responses:
        '201':
          description: VLAN mapping created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VLANMapping'

  # Coverage Planning
  /wireless/coverage-plans:
    get:
      summary: List coverage plans
      description: Retrieve coverage area plans
      tags:
        - Coverage Planning
      responses:
        '200':
          description: Coverage plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CoveragePlan'

    post:
      summary: Create coverage plan
      description: Create a new coverage area plan
      tags:
        - Coverage Planning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoveragePlanRequest'
      responses:
        '201':
          description: Coverage plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveragePlan'

  # Bandwidth Policies
  /wireless/bandwidth-policies:
    get:
      summary: List bandwidth policies
      description: Retrieve all bandwidth policy templates
      tags:
        - Bandwidth Policies
      responses:
        '200':
          description: Bandwidth policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BandwidthPolicy'

    post:
      summary: Create bandwidth policy
      description: Create a new bandwidth policy template
      tags:
        - Bandwidth Policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBandwidthPolicyRequest'
      responses:
        '201':
          description: Bandwidth policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BandwidthPolicy'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    SSID:
      type: object
      properties:
        id:
          type: string
          description: Unique SSID identifier
        name:
          type: string
          description: SSID name (broadcast name)
          maxLength: 32
        enabled:
          type: boolean
          description: Whether SSID is enabled
        securityProfileId:
          type: string
          description: Associated security profile ID
        vlanId:
          type: integer
          description: Default VLAN ID for this SSID
        bandwidthPolicyId:
          type: string
          description: Associated bandwidth policy ID
        coveragePlanId:
          type: string
          description: Associated coverage plan ID
        vendor:
          type: string
          enum: [cisco-meraki, fortiap, cisco-catalyst, aruba]
        accessPoints:
          type: array
          items:
            type: string
          description: List of access point IDs broadcasting this SSID
        vendorSpecific:
          type: object
          description: Vendor-specific configuration parameters
        metadata:
          type: object
          properties:
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            createdBy:
              type: string
            description:
              type: string

    CreateSSIDRequest:
      type: object
      required:
        - name
        - securityProfileId
      properties:
        name:
          type: string
          maxLength: 32
          pattern: '^[a-zA-Z0-9_-]+$'
        enabled:
          type: boolean
          default: true
        securityProfileId:
          type: string
        vlanId:
          type: integer
          minimum: 1
          maximum: 4094
        bandwidthPolicyId:
          type: string
        coveragePlanId:
          type: string
        accessPoints:
          type: array
          items:
            type: string
        vendorSpecific:
          type: object
        description:
          type: string
          maxLength: 255

    UpdateSSIDRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 32
          pattern: '^[a-zA-Z0-9_-]+$'
        enabled:
          type: boolean
        securityProfileId:
          type: string
        vlanId:
          type: integer
          minimum: 1
          maximum: 4094
        bandwidthPolicyId:
          type: string
        coveragePlanId:
          type: string
        accessPoints:
          type: array
          items:
            type: string
        vendorSpecific:
          type: object
        description:
          type: string
          maxLength: 255

    BulkSSIDRequest:
      type: object
      properties:
        operation:
          type: string
          enum: [create, update, delete]
        ssids:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/CreateSSIDRequest'
              - $ref: '#/components/schemas/UpdateSSIDRequest'
        options:
          type: object
          properties:
            continueOnError:
              type: boolean
              default: false
            validateOnly:
              type: boolean
              default: false

    AccessPoint:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        vendor:
          type: string
          enum: [cisco-meraki, fortiap, cisco-catalyst, aruba]
        model:
          type: string
        serialNumber:
          type: string
        macAddress:
          type: string
        ipAddress:
          type: string
        location:
          type: object
          properties:
            building:
              type: string
            floor:
              type: string
            room:
              type: string
            coordinates:
              type: object
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
        status:
          type: string
          enum: [online, offline, maintenance, error]
        ssids:
          type: array
          items:
            type: string
        capabilities:
          type: object
          properties:
            maxSSIDs:
              type: integer
            supportedBands:
              type: array
              items:
                type: string
                enum: ['2.4GHz', '5GHz', '6GHz']
            maxClients:
              type: integer
        vendorSpecific:
          type: object
        metadata:
          type: object
          properties:
            createdAt:
              type: string
              format: date-time
            lastSeen:
              type: string
              format: date-time
            firmware:
              type: string

    CreateAccessPointRequest:
      type: object
      required:
        - name
        - vendor
        - model
        - macAddress
      properties:
        name:
          type: string
        vendor:
          type: string
          enum: [cisco-meraki, fortiap, cisco-catalyst, aruba]
        model:
          type: string
        serialNumber:
          type: string
        macAddress:
          type: string
          pattern: '^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$'
        ipAddress:
          type: string
          format: ipv4
        location:
          type: object
          properties:
            building:
              type: string
            floor:
              type: string
            room:
              type: string
            coordinates:
              type: object
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
        vendorSpecific:
          type: object

    UpdateAccessPointRequest:
      type: object
      properties:
        name:
          type: string
        ipAddress:
          type: string
          format: ipv4
        location:
          type: object
          properties:
            building:
              type: string
            floor:
              type: string
            room:
              type: string
            coordinates:
              type: object
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
        vendorSpecific:
          type: object

    SecurityProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        authType:
          type: string
          enum: [open, wep, wpa2_psk, wpa2_enterprise, wpa3_psk, wpa3_enterprise]
        encryption:
          type: string
          enum: [none, wep, tkip, aes, mixed]
        passphrase:
          type: string
          format: password
        radiusConfig:
          type: object
          properties:
            primaryServer:
              type: object
              properties:
                host:
                  type: string
                port:
                  type: integer
                  default: 1812
                secret:
                  type: string
                  format: password
            secondaryServer:
              type: object
              properties:
                host:
                  type: string
                port:
                  type: integer
                  default: 1812
                secret:
                  type: string
                  format: password
        certificateConfig:
          type: object
          properties:
            caCertificate:
              type: string
            serverCertificate:
              type: string
            privateKey:
              type: string
              format: password
        vendorSpecific:
          type: object
        isTemplate:
          type: boolean
          default: false
        metadata:
          type: object
          properties:
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            createdBy:
              type: string
            description:
              type: string

    CreateSecurityProfileRequest:
      type: object
      required:
        - name
        - authType
      properties:
        name:
          type: string
          maxLength: 64
        authType:
          type: string
          enum: [open, wep, wpa2_psk, wpa2_enterprise, wpa3_psk, wpa3_enterprise]
        encryption:
          type: string
          enum: [none, wep, tkip, aes, mixed]
        passphrase:
          type: string
          format: password
          minLength: 8
          maxLength: 63
        radiusConfig:
          type: object
          properties:
            primaryServer:
              type: object
              required: [host, secret]
              properties:
                host:
                  type: string
                port:
                  type: integer
                  default: 1812
                secret:
                  type: string
                  format: password
            secondaryServer:
              type: object
              properties:
                host:
                  type: string
                port:
                  type: integer
                  default: 1812
                secret:
                  type: string
                  format: password
        certificateConfig:
          type: object
        vendorSpecific:
          type: object
        isTemplate:
          type: boolean
          default: false
        description:
          type: string
          maxLength: 255

    UpdateSecurityProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 64
        authType:
          type: string
          enum: [open, wep, wpa2_psk, wpa2_enterprise, wpa3_psk, wpa3_enterprise]
        encryption:
          type: string
          enum: [none, wep, tkip, aes, mixed]
        passphrase:
          type: string
          format: password
          minLength: 8
          maxLength: 63
        radiusConfig:
          type: object
        certificateConfig:
          type: object
        vendorSpecific:
          type: object
        isTemplate:
          type: boolean
        description:
          type: string
          maxLength: 255

    VLANMapping:
      type: object
      properties:
        id:
          type: string
        ssidId:
          type: string
        vlanId:
          type: integer
          minimum: 1
          maximum: 4094
        mode:
          type: string
          enum: [tagged, untagged]
        accessPoints:
          type: array
          items:
            type: string
        metadata:
          type: object
          properties:
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            createdBy:
              type: string

    CreateVLANMappingRequest:
      type: object
      required:
        - ssidId
        - vlanId
      properties:
        ssidId:
          type: string
        vlanId:
          type: integer
          minimum: 1
          maximum: 4094
        mode:
          type: string
          enum: [tagged, untagged]
          default: tagged
        accessPoints:
          type: array
          items:
            type: string

    CoveragePlan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        areas:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              bounds:
                type: object
                properties:
                  coordinates:
                    type: array
                    items:
                      type: array
                      items:
                        type: number
              requiredSignalStrength:
                type: integer
                minimum: -90
                maximum: -30
              expectedClientDensity:
                type: integer
                minimum: 1
        accessPointPlacements:
          type: array
          items:
            type: object
            properties:
              apId:
                type: string
              coordinates:
                type: object
                properties:
                  latitude:
                    type: number
                  longitude:
                    type: number
              expectedCoverage:
                type: object
                properties:
                  radius:
                    type: number
                  signalStrength:
                    type: integer
        metadata:
          type: object

    CreateCoveragePlanRequest:
      type: object
      required:
        - name
        - areas
      properties:
        name:
          type: string
        description:
          type: string
        areas:
          type: array
          items:
            type: object

    BandwidthPolicy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        rules:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              priority:
                type: integer
                minimum: 1
                maximum: 100
              conditions:
                type: object
                properties:
                  userGroups:
                    type: array
                    items:
                      type: string
                  deviceTypes:
                    type: array
                    items:
                      type: string
                  timeWindows:
                    type: array
                    items:
                      type: object
              actions:
                type: object
                properties:
                  maxBandwidthUp:
                    type: integer
                    description: Maximum upload bandwidth in Mbps
                  maxBandwidthDown:
                    type: integer
                    description: Maximum download bandwidth in Mbps
                  qosClass:
                    type: string
                    enum: [gold, silver, bronze]
                  trafficShaping:
                    type: boolean
        isTemplate:
          type: boolean
          default: false
        metadata:
          type: object

    CreateBandwidthPolicyRequest:
      type: object
      required:
        - name
        - rules
      properties:
        name:
          type: string
        description:
          type: string
        rules:
          type: array
          items:
            type: object
        isTemplate:
          type: boolean
          default: false

    BulkOperationResponse:
      type: object
      properties:
        operationId:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, failed]
        totalItems:
          type: integer
        processedItems:
          type: integer
        successfulItems:
          type: integer
        failedItems:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              itemIndex:
                type: integer
              error:
                type: string
              details:
                type: object
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
