version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nsrg-postgres-dev
    environment:
      POSTGRES_DB: nsrg_db_dev
      POSTGRES_USER: nsrg_user
      POSTGRES_PASSWORD: nsrg_dev_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "0.0.0.0:5433:5432"  # Bind to all interfaces
    networks:
      - nsrg-dev-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nsrg-redis-dev
    command: redis-server --appendonly yes --requirepass redis_dev_password
    volumes:
      - redis_dev_data:/data
    ports:
      - "0.0.0.0:6380:6379"  # Bind to all interfaces
    networks:
      - nsrg-dev-network
    restart: unless-stopped

  # Backend Development
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nsrg-backend-dev
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nsrg_db_dev
      DB_USER: nsrg_user
      DB_PASSWORD: nsrg_dev_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_dev_password
      JWT_SECRET: dev-jwt-secret-key
      API_BASE_URL: http://10.0.10.4:5000
    ports:
      - "0.0.0.0:5000:5000"
    volumes:
      - ./src/backend:/app/src/backend
      - ./src/shared:/app/src/shared
      - ./config:/app/config
      - ./scripts:/app/scripts
      - ./package.json:/app/package.json
      - /app/node_modules  # Anonymous volume for node_modules
    networks:
      - nsrg-dev-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    command: npm run dev:backend

  # Frontend Development
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.dev
    container_name: nsrg-frontend-dev
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules  # Anonymous volume for node_modules
    networks:
      - nsrg-dev-network
    environment:
      VITE_API_BASE_URL: http://10.0.10.4:5000
    restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  nsrg-dev-network:
    driver: bridge